<div class="wrap">
<header><div class="logo">Grammar <b>Pop!</b> ✦</div><span class="pill">ENGLISH II · p.94 · E-WASTE</span></header>
<section class="hero"><div class="eyebrow">THINK · CHOOSE · WRITE</div><h1>문법, 감 잡고 팝!</h1><p>형태를 보고, 의미를 생각하고, 직접 써 보세요.<br>4개의 챌린지 · 40문항 · 시간제한 없이 나의 속도로</p></section>
<nav class="tabs" aria-label="문제 카테고리" id="tabs"></nav>
<main class="card" id="main"></main>
<p class="footer">본문 일부 발췌·연습용 재구성 · 개인 연습 / 교실 화면 공유용 · 실시간 접속·순위 기능 없음 · 기록은 이 화면을 여는 동안만 유지됩니다.</p>

<script>
const P=(s,t,form,voice,ex,hint)=>({s,t,form,voice,ex,hint});
const parts=[
P('The term refers to <mark>discarded</mark> electronic devices and electrical appliances.','이 용어는 버려진 전자기기와 전기제품을 가리킵니다.','과거분사','수동','discarded는 뒤의 명사를 꾸밉니다. 기기가 무언가를 버리는 것이 아니라 사람들에 의해 버려진 것이므로 수동의 의미입니다.','discard: 버리다 / 무엇이 버려졌나요?'),
P('Due to toxic materials <mark>contained</mark> in these products, e-waste is a serious hazard.','이 제품에 포함된 유독성 물질 때문에 전자폐기물은 심각한 위험 요소입니다.','과거분사','수동','contained in these products가 앞의 materials를 꾸밉니다. 물질이 제품에 포함되어 있으므로 수동의 의미입니다. 과거분사라고 반드시 과거 시간을 뜻하지는 않습니다.','contain: 포함하다 / 제품이 물질을 포함하나요, 물질이 제품에 포함되나요?'),
P('The amount of e-waste <mark>produced</mark> each year is increasing at an alarming rate.','매년 발생하는 전자폐기물의 양이 우려할 만큼 빠르게 증가하고 있습니다.','과거분사','수동','produced each year는 e-waste를 꾸밉니다. 폐기물이 만들어지는 것이므로 수동의 의미입니다. 문장의 동사는 is increasing입니다.','produce: 만들어 내다 / 어떤 전자폐기물인가요?'),
P('In 2021, a total of 57.4 million metric tons of e-waste was <mark>generated</mark> worldwide.','2021년에는 전 세계에서 총 5,740만 톤의 전자폐기물이 발생했습니다.','과거분사','수동','generated는 과거분사이며 was generated 전체가 과거 수동태입니다. 한국어로는 자연스럽게 ‘발생했다’라고 해석해도 영어 구조는 수동태입니다.','generate: 발생시키다 / was + p.p.의 구조를 보세요.'),
P('2014 was the year when data about e-waste was first <mark>collected</mark>.','2014년은 전자폐기물에 관한 자료가 처음 수집된 해였습니다.','과거분사','수동','collected는 과거분사입니다. was first collected는 ‘처음 수집되었다’라는 과거 수동태로, 자료가 수집의 대상입니다.','collect: 수집하다 / 자료가 스스로 수집하나요?'),
P('The amount of e-waste <mark>generated</mark> annually will have doubled by 2030.','매년 발생하는 전자폐기물의 양은 2030년까지 두 배가 되어 있을 것입니다.','과거분사','수동','generated annually는 e-waste를 뒤에서 꾸미며 수동 의미를 나타냅니다. 이 문장의 동사는 will have doubled입니다.','annually: 매년 / generated 앞에 be동사가 있나요?'),
P('Efforts are being <mark>made</mark> to address this problem.','이 문제에 대응하려는 노력이 이루어지고 있습니다.','과거분사','수동','판단 대상 made는 과거분사입니다. are being made 전체는 현재진행형 수동태입니다. being 자체는 be의 현재분사지만 made의 형태와 구분해야 합니다.','make efforts: 노력하다 / 여기서는 made만 형태를 판단하세요.'),
P('Most of these efforts are <mark>focused</mark> on making products easier to repair.','이 노력의 대부분은 제품을 더 쉽게 수리하도록 만드는 데 초점이 맞춰져 있습니다.','과거분사','수동','focused는 과거분사 형태입니다. be focused on은 ‘~에 초점이 맞춰져 있다’라는 수동 의미·상태를 나타냅니다. 문맥상 상태를 나타내는 형용사적 용법으로도 설명할 수 있습니다.','focus efforts on ~: 노력을 ~에 집중시키다'),
P('The amount of e-waste is <mark>increasing</mark> at an alarming rate.','전자폐기물의 양이 우려할 만큼 빠르게 증가하고 있습니다.','현재분사','능동','increasing은 현재분사이며 is increasing은 현재진행형 능동태입니다. increase는 여기서 ‘증가하다’라는 자동사입니다. ‘스스로 의지를 가지고 한다’는 뜻이어야 능동인 것은 아닙니다.','비교 문제 / 증가시키다와 증가하다 중 어떤 뜻인가요?'),
P('Efforts are focused on <mark>making</mark> products easier to repair.','노력은 제품을 더 쉽게 수리하도록 만드는 데 초점이 맞춰져 있습니다.','동명사','능동','making은 -ing 형태지만 전치사 on 뒤에서 명사 역할을 하는 동명사입니다. 제품을 쉽게 수리할 수 있게 ‘만드는’ 능동 의미입니다. 모든 -ing가 현재분사는 아닙니다.','비교 문제 / 전치사 on 뒤에 온 -ing의 역할을 생각하세요.')
];
const future=[
['By tomorrow, I','this book.','내일까지는 이 책을 다 읽은 상태일 거예요.','finish','will have finished','finish → finished. 미래의 기준은 tomorrow입니다.'],
['By Friday, we','our project.','금요일까지는 우리 프로젝트를 완성했을 거예요.','complete','will have completed','complete → completed. 금요일까지 완료된 상태를 나타냅니다.'],
['By noon, she','her room.','정오까지는 그녀가 방 청소를 끝냈을 거예요.','clean','will have cleaned','clean → cleaned. 주어가 she여도 will 뒤에는 have를 씁니다.'],
['By the end of this class, you','five new words.','이 수업이 끝날 때까지는 새로운 단어 다섯 개를 배웠을 거예요.','learn','will have learned','learn → learned 또는 learnt. 둘 다 정답으로 인정합니다.'],
['By next month, I','enough money to buy a bike.','다음 달까지는 자전거를 살 만큼 충분한 돈을 모았을 거예요.','save','will have saved','save → saved. will have 뒤에는 과거분사를 씁니다.'],
['By six o’clock, Dad','dinner.','6시까지는 아빠가 저녁을 다 준비했을 거예요.','cook','will have cooked','cook → cooked. 미래 기준 시점까지 완료된 상태입니다.'],
['By the time you arrive, I','.','네가 도착할 때쯤에는 나는 이미 떠나 있을 거야.','leave','will have left','leave → left. 시간의 부사절에서는 미래의 일도 arrive처럼 현재형으로 표현합니다.'],
['By the time the movie starts, we','dinner.','영화가 시작할 때쯤에는 우리는 저녁을 다 먹었을 거예요.','eat','will have eaten','eat → ate → eaten. 여기서는 과거형 ate가 아니라 과거분사 eaten입니다. starts는 시간의 부사절의 현재형입니다.'],
['By the time you get home, your laptop','.','집에 도착할 때쯤에는 네 노트북 수리가 끝나 있을 거야.','repair · 수동태','will have been repaired','미래완료 수동태는 will have been + p.p.입니다. 노트북이 수리를 받는 대상이므로 been이 필요합니다.'],
['By 2030, the number of students at our school','.','2030년까지는 우리 학교 학생 수가 두 배가 되어 있을 거예요.','double','will have doubled','double → doubled. ‘수가 두 배가 되다’라는 능동 표현입니다. 교과서에서는 연간 발생량을 2014년과 2030년 사이의 16년 동안 비교합니다.']
].map((x,i)=>({before:x[0],after:x[1],t:x[2],verb:x[3],answer:x[4],ex:x[5],alternatives:i===3?['will have learnt']:[]}));
const agreement=[
['I have ten <mark>books</mark>, most of which','novels.','나는 책이 열 권 있는데, 대부분 소설이다.',['is','are'],'are','books','복수'],
['She took many <mark>photos</mark>, most of which','her family.','그녀는 사진을 많이 찍었는데, 대부분 가족의 모습을 담고 있다.',['show','shows'],'show','photos','복수'],
['We bought some <mark>apples</mark>, most of which','red.','우리는 사과를 좀 샀는데, 대부분 빨간색이다.',['are','is'],'are','apples','복수'],
['He has five <mark>bags</mark>, most of which','gifts.','그는 가방이 다섯 개 있는데, 대부분 선물로 받은 것이다.',['was','were'],'were','bags','복수'],
['I watched several <mark>movies</mark>, most of which','funny.','나는 영화 몇 편을 봤는데, 대부분 재미있었다.',['were','was'],'were','movies','복수'],
['She gave me some <mark>information</mark>, most of which','useful.','그녀는 나에게 정보를 좀 주었는데, 대부분 유용하다.',['are','is'],'is','information','불가산'],
['We bought some <mark>furniture</mark>, most of which','made of wood.','우리는 가구를 좀 샀는데, 대부분 나무로 만들어져 있다.',['is','are'],'is','furniture','불가산'],
['He gave me some <mark>advice</mark>, most of which','helpful.','그는 나에게 조언을 좀 해 주었는데, 대부분 도움이 되었다.',['were','was'],'was','advice','불가산'],
['There is some <mark>food</mark> in the fridge, most of which','to be eaten today.','냉장고에 음식이 좀 있는데, 대부분 오늘 먹어야 한다.',['need','needs'],'needs','food','불가산'],
['She saved some <mark>money</mark>, most of which','spent on books.','그녀는 돈을 좀 모았는데, 대부분 책을 사는 데 쓰였다.',['was','were'],'was','money','불가산']
].map(x=>({before:x[0],after:x[1],t:x[2],options:x[3],answer:x[4],noun:x[5],kind:x[6],ex:'which → '+x[5]+'. '+(x[6]==='복수'?'셀 수 있는 복수 명사이므로 복수 동사 ':'이 문장에서는 셀 수 없는 명사이므로 단수 동사 ')+x[4]+'를 씁니다.'}));

const formOptions=[
['discard','discarding','discarded','to discard'],
['contained','contain','containing','to contain'],
['produces','producing','to produce','produced'],
['generate','generated','generating','to generate'],
['collect','collecting','collected','to collect'],
['generated','generates','generating','to generate'],
['make','making','to make','made'],
['focus','focused','focuses','to focus'],
['increasing','increase','increases','to increase'],
['make','made','making','to make']
];
const formQuiz=parts.map((q,i)=>{
const match=q.s.match(/<mark>(.*?)<\/mark>/);
const pieces=q.s.split(/<mark>.*?<\/mark>/);
return {before:pieces[0],after:pieces[1],t:q.t,answer:match[1],options:formOptions[i],hint:q.hint,ex:q.ex};
});

const bank=[parts,formQuiz,future,agreement];
const names=['분사 탐정','동사 형태 고르기','미래완료 작가','수 일치 챔피언'];
const desc=['기본 8 + 비교 2 · 버튼 선택','10문항 · 네 가지 형태 선택','10문항 · 영어 직접 입력','10문항 · 동사 선택'];
const rules=[
'표시된 단어의 형태와 의미를 각각 선택하세요. 형태와 문장 전체의 태는 구분합니다.',
'해석과 문장 구조를 보고 빈칸에 맞는 형태를 고르세요. 명사를 꾸미는 말인지, 동사의 일부인지 확인하세요.',
'미래의 어느 시점까지는 이미 끝낸 상태: will have + p.p. 빈칸에 동사구 전체를 쓰세요.',
'most만 보고 판단하지 마세요. which가 가리키는 명사를 보고 동사를 선택하세요.'
];
let cat=0;
const fresh=ids=>({ids:ids||Array.from({length:10},(_,i)=>i),pos:0,results:[],pick:{},draft:'',checked:false,hint:false,done:false});
let states=[fresh(),fresh(),fresh(),fresh()];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ');

function choices(group,options){
const st=states[cat];
return '<div class="choices">'+options.map((o,i)=>'<button class="choice '+(st.pick[group]===o?'selected':'')+'" data-group="'+group+'" data-value="'+esc(o)+'" aria-pressed="'+(st.pick[group]===o)+'" '+(st.checked?'disabled':'')+'>'+['▲','●','◆','■'][i]+' '+esc(o)+(group==='voice'?'<span>'+(o==='능동'?'~하다 / ~되다(자동사)':'~에 의해 되다 / 수동적 상태')+'</span>':'')+'</button>').join('')+'</div>';
}
function render(){
const st=states[cat];
$('tabs').innerHTML=names.map((n,i)=>'<button class="tab '+(cat===i?'active':'')+'" data-cat="'+i+'" aria-current="'+(cat===i?'page':'false')+'"><strong><span class="dot">'+(i+1)+'</span>'+n+'</strong><small>'+desc[i]+'</small><small>'+states[i].results.length+'/'+states[i].ids.length+' 확인'+(states[i].ids.length<10?' · 오답 복습':'')+'</small></button>').join('');
if(st.done){resultView();return}
const q=bank[cat][st.ids[st.pos]],count=st.results.filter(r=>r.ok).length;
let html='<div class="top"><span>'+names[cat]+' · '+(st.pos+1)+' / '+st.ids.length+'</span><span>✦ '+count*100+'점</span></div><div class="track"><div class="fill" style="width:'+st.pos/st.ids.length*100+'%"></div></div><div class="rule">'+rules[cat]+'</div>';
html+='<div class="question">'+(cat===0?q.s:q.before+' <mark>________</mark> '+q.after)+'</div><p class="translation">'+q.t+'</p>';
if(cat===0)html+='<p class="label">01 · 표시된 단어의 형태는?</p>'+choices('form',q.form==='동명사'?['과거분사','현재분사','동명사']:['과거분사','현재분사'])+'<p class="label">02 · 그 표현이 나타내는 의미는?</p>'+choices('voice',['능동','수동']);
if(cat===2)html+='<p class="label"><label for="answer">동사 원형: '+q.verb+' · will부터 입력</label></p><input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="will have ..." value="'+esc(st.draft)+'" '+(st.checked?'disabled':'')+'><p class="muted">주어는 쓰지 마세요. 대소문자·앞뒤 공백은 채점에 영향을 주지 않습니다.</p>';
if(cat===1||cat===3)html+='<p class="label">빈칸에 들어갈 동사를 선택하세요.</p>'+choices('verb',q.options);
html+='<div class="actions">'+(!st.checked?'<button class="primary" id="check" disabled>정답 확인</button><button class="secondary" id="hint">힌트 '+(st.hint?'닫기':'보기')+'</button>':'<button class="primary" id="next">'+(st.pos===st.ids.length-1?'결과 보기':'다음 문제 →')+'</button><button class="secondary" id="listen">문장 듣기 ♫</button>')+'</div>';
if(st.hint&&!st.checked)html+='<div class="hint">'+((cat===0||cat===1)?q.hint:cat===2?(st.ids[st.pos]===8?'노트북은 수리받는 대상입니다. will have been + 과거분사':'will + have + 과거분사. 주어가 바뀌어도 have는 그대로입니다.'):'which = '+q.noun+' · '+(q.kind==='복수'?'여러 개를 세는 복수 명사':'셀 수 없는 명사'))+'</div>';
if(st.checked){
const r=st.results[st.pos];
html+='<div class="feedback '+(r.ok?'':'bad')+'" role="status"><strong>'+(r.ok?'✓ 정확해요! +100점':'↺ 이유를 확인하고 기억해요')+'</strong><p>정답: <b>'+esc(cat===0?q.form+' · '+q.voice:q.answer)+'</b></p>'+(!r.ok?'<p>내 답: '+esc(r.given)+'</p>':'')+'<p>'+q.ex+'</p></div><p class="muted" id="audioStatus" aria-live="polite"></p>';
}
$('main').innerHTML=html;updateCheck();
}
function updateCheck(){
const b=$('check'),st=states[cat];
if(b)b.disabled=cat===0?!(st.pick.form&&st.pick.voice):cat===2?!st.draft.trim():!st.pick.verb;
}
function check(){
const st=states[cat];
if(st.checked||$('check').disabled)return;
const q=bank[cat][st.ids[st.pos]];
let ok,given;
if(cat===0){given=st.pick.form+' · '+st.pick.voice;ok=st.pick.form===q.form&&st.pick.voice===q.voice;}
else if(cat===2){given=st.draft;ok=[q.answer,...q.alternatives].some(a=>norm(a)===norm(given));}
else{given=st.pick.verb;ok=given===q.answer;}
st.results.push({id:st.ids[st.pos],ok,given});st.checked=true;render();$('next').focus();
}
function resultView(){
const st=states[cat],correct=st.results.filter(x=>x.ok).length,wrong=st.results.filter(x=>!x.ok);
$('main').innerHTML='<div class="results"><div class="eyebrow" style="color:#397348">CHALLENGE COMPLETE</div><h2>'+names[cat]+' 완료!</h2><div class="score">'+correct*100+'<span style="font-size:20px"> 점</span></div><p>'+st.ids.length+'문항 중 '+correct+'문항 정답 · '+Math.round(correct/st.ids.length*100)+'%</p><p class="muted">분사 문제는 두 선택이 모두 맞으면 정답입니다.<br>점수는 이번 도전의 첫 제출을 기준으로 계산합니다.</p><div class="actions" style="justify-content:center">'+(wrong.length?'<button class="primary" id="retry">오답 '+wrong.length+'개 다시 풀기</button>':'')+'<button class="secondary" id="restart">전체 10문항 다시 풀기</button><button class="secondary" id="other">다른 카테고리 →</button></div>'+wrong.map(r=>{
const q=bank[cat][r.id];
return '<div class="review"><b>'+esc(cat===0?q.form+' · '+q.voice:q.answer)+'</b><p>'+(cat===0?q.s:q.before+' <mark>'+q.answer+'</mark> '+q.after)+'</p>'+q.ex+'</div>';
}).join('')+'</div>';
}
document.addEventListener('input',e=>{
if(e.target.id==='answer'){states[cat].draft=e.target.value;updateCheck();}
});
document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();check();}
});
document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||b.disabled)return;
const st=states[cat];
if(b.dataset.cat!==undefined){
if('speechSynthesis'in window)speechSynthesis.cancel();
cat=+b.dataset.cat;render();return;
}
if(b.dataset.group){st.pick[b.dataset.group]=b.dataset.value;render();return}
switch(b.id){
case 'check':check();break;
case 'hint':st.hint=!st.hint;render();break;
case 'next':
if('speechSynthesis'in window)speechSynthesis.cancel();
if(st.pos===st.ids.length-1)st.done=true;
else{st.pos++;st.checked=false;st.pick={};st.draft='';st.hint=false;}
render();if($('answer'))$('answer').focus();break;
case 'retry':states[cat]=fresh(st.results.filter(r=>!r.ok).map(r=>r.id));render();break;
case 'restart':states[cat]=fresh();render();break;
case 'other':cat=(cat+1)%4;render();break;
case 'listen':
if(!('speechSynthesis'in window)){$('audioStatus').textContent='이 환경에서는 음성 읽기를 지원하지 않습니다.';break}
const q=bank[cat][st.ids[st.pos]],tmp=document.createElement('div');
tmp.innerHTML=cat===0?q.s:q.before+' '+q.answer+' '+q.after;
const u=new SpeechSynthesisUtterance(tmp.textContent);u.lang='en-US';u.rate=.85;
u.onerror=()=>{if($('audioStatus'))$('audioStatus').textContent='음성을 재생할 수 없습니다. 브라우저의 음성 지원을 확인하세요.'};
speechSynthesis.cancel();speechSynthesis.speak(u);
$('audioStatus').textContent='영어 문장을 읽습니다. 음성은 기기·브라우저에 따라 다릅니다.';
break;
}
});
render();
</script>
</html>
